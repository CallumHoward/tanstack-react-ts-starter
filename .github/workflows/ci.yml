name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so diff-cover can find the merge-base with the PR base branch.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No pnpm store cache: a cold install costs about what restoring and
      # saving the store does.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm only warns on unmet peers; fail so Dependabot can't bump past a peer range.
      - name: Peer dependencies
        run: pnpm peers check

      # Fail if the lockfile has avoidable duplicate resolutions (fix with `pnpm dedupe`).
      - name: Dedupe
        run: pnpm dedupe --check

      - name: Typecheck
        run: pnpm check

      - name: Lint
        # lint:ci uses --format=github for inline PR annotations on lint errors.
        run: pnpm lint:ci

      - name: Lint CSS
        run: pnpm lint:css

      - name: Format check
        run: pnpm format:check

      - name: Fallow
        run: pnpm fallow

      - name: Test
        run: pnpm test:cov

      # Gate coverage of changed lines only -- reads the HEAD lcov report plus
      # the git diff against the base branch (no baseline or second run needed).
      - name: Diff coverage
        run: |
          pipx run diff-cover==10.5.1 coverage/lcov.info \
            --compare-branch origin/${{ github.base_ref || 'main' }} \
            --fail-under 80

      - name: Build
        run: pnpm build

      - name: Resolve Playwright version
        # The browser cache key must match the exact Playwright build it
        # belongs to.
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Deliberately no restore-keys: another Playwright version's browser
          # build can't be driven, so a partial hit is worse than a miss.
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      # CI runs against the production preview (pnpm serve), reusing the build
      # from the step above rather than rebuilding.
      - name: E2E
        run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Main-only and last, so the save follows a green job; a PR's own entries
      # are readable only by that PR.
      - name: Save Playwright browsers
        if: github.ref_name == github.event.repository.default_branch && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
