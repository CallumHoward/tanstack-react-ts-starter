name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  ci:
    uses: callumhoward/ts-shared-config/.github/workflows/ci-reusable.yml@v1
    with:
      run-build: true
      run-e2e: true
      check-peers: true
      check-dedupe: true
