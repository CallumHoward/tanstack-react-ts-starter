version: 2
updates:
  - package-ecosystem: "npm" # covers pnpm; auto-detects pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # mirrors pnpm minimumReleaseAge (10080 min = 7 days)
    open-pull-requests-limit: 10
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      react:
        patterns: ["react", "react-dom"]
      oxc:
        patterns: ["oxlint*", "oxfmt", "eslint-plugin-playwright"]
      types:
        patterns: ["@types/*"]
      # plugin-react pins oxc-transform-react's minor via its peer range.
      react-compiler:
        patterns: ["@vitejs/plugin-react", "oxc-transform-react"]
      # `typescript` aliases @typescript/typescript6 (API for tooling); @typescript/native is TS 7.
      typescript:
        patterns: ["typescript", "@typescript/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Groups match in order, so this only catches dev deps not grouped above.
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "nitro" # intentionally tracks the v3 beta "latest"
      # Stops a non-dealiased bump from replacing the TS 6 API alias with TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep @types/node on the major matching the Node runtime (.nvmrc);
      # bump it by hand when moving to the next Node LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
